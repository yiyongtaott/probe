name: workmanager
description: Flutter Workmanager (Android-only local fork). Android keeps the upstream
  background scheduling behavior; the iOS implementation is intentionally removed so
  the host app can keep its iOS 12 deployment target and use its own native Background
  Fetch implementation instead (workmanager's iOS pod requires iOS 13).
version: 0.7.0
homepage: https://github.com/fluttercommunity/flutter_workmanager
repository: https://github.com/fluttercommunity/flutter_workmanager
issue_tracker: https://github.com/fluttercommunity/flutter_workmanager/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  build_runner: ^2.4.0
  test: ^1.25.0
  mockito: ^5.4.4
  get_it: ^8.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.fluttercommunity.workmanager
        pluginClass: WorkmanagerPlugin
